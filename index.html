<h1>Alpymist packages: dev</h1>
<p>Every push to main of <a href="https://github.com/bisand/alpymist">Alpymist</a>, built and signed by CI with a key of its own. Expect breakage. On Alpymist:</p>
<pre>doas alpymist channel dev</pre>
<p>and back with <code>doas alpymist channel stable</code>, which also stops trusting this key.</p>
